name: Appointment Monitor

on:
  schedule:
    # GitHub schedules are best-effort; expect a few minutes of jitter.
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Skip sending email; just log what would be sent.'
        type: boolean
        default: false
      cutoff:
        description: 'Alert only on slots strictly before this ISO date.'
        type: string
        default: '2026-08-01'

permissions:
  contents: write

concurrency:
  group: appointment-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: appointment_monitor/requirements.txt

      - name: Install dependencies
        run: pip install -r appointment_monitor/requirements.txt

      - name: Run monitor
        working-directory: appointment_monitor
        env:
          SMTP_HOST: smtp.gmail.com
          SMTP_PORT: '587'
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
        run: |
          python monitor.py \
            --cutoff "${{ inputs.cutoff || '2026-08-01' }}" \
            ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Persist state file
        if: ${{ !inputs.dry_run }}
        run: |
          set -e
          STATE=appointment_monitor/seen_slots.json
          if [ ! -f "$STATE" ]; then
            echo "No state file to commit."
            exit 0
          fi
          # Stage forcefully because the local .gitignore excludes the state file.
          git add -f "$STATE"
          if git diff --cached --quiet; then
            echo "State unchanged; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "appointment-monitor: update state [skip ci]"
          for i in 1 2 3 4; do
            if git push origin HEAD:${GITHUB_REF#refs/heads/}; then
              exit 0
            fi
            echo "push failed; retrying in $((2**i))s"
            sleep $((2**i))
          done
          echo "push failed after retries" >&2
          exit 1
